generate_script_task:
  description: >
    Analyze the user command: '{text_command}' targeting OS '{target_os}'.

    Available Tools Manifest:
    {tools_registry}

    Selection Rules:
    1. Inspect the provided tools manifest above and select the tool name that best handles '{text_command}'.
    2. Set 'type' in ActionState to the exact tool name matched from the manifest.
    3. Extract necessary arguments into the 'params' dictionary.
    4. Set 'target' to the primary application or file target, and 'element' to any UI sub-element to be accessed(or empty string).
    5. Set 'requires_approval' to true if the selected tool has 'destructive: true' in the manifest.
  expected_output: >
    An ActionState JSON object containing type, params, target, element, and requires_approval.
  agent: tasks_generator